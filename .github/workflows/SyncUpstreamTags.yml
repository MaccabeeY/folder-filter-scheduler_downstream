name: Sync Upstream Tags

on:
  workflow_dispatch:

jobs:
  sync-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Tags from Upstream
        run: |
          UPSTREAM_URL="https://github.com{{ github.event.repository.parent.full_name }}.git"
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream --tags
          git push origin --tags
